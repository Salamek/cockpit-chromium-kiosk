<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Kiosk</title>
  <link rel="stylesheet" href="style.css">
  <script src="../base1/cockpit.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Chromium Kiosk</h1>
        <p class="path">/etc/chromium-kiosk/config.yml</p>
      </div>
      <div class="actions">
        <button type="button" id="reload">Reload</button>
        <button type="submit" form="settings" class="primary" id="save" disabled>Save changes</button>
      </div>
    </header>
    <p id="status" role="status"></p>
    <form id="settings" novalidate aria-label="Kiosk configuration">
      <fieldset id="fields" disabled></fieldset>
    </form>
  </main>
</body>
</html>
